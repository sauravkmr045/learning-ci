name: Run Python via Docker

on:
  push:
    branches:
      - master

jobs:
  docker-run:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout your repository code
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step 2: Build the Docker image using your Dockerfile
      - name: Build Docker Image
        run: |
          docker build -t my-python-app .

      # Step 3: Run the container (which executes your main.py)
      - name: Run Docker Container
        run: |
          docker run --rm my-python-app